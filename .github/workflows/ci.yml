name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.13.0', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test, and build
        run: npm run verify
        env:
          CI: true

      - name: Smoke-test the built CLI
        run: node dist/cli.js --version
        env:
          COMICODE_HOME: ${{ runner.temp }}/comicode-home

  package-install:
    name: Global install from tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack the release artifact
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install globally
        run: npm install -g "$(ls "$RUNNER_TEMP"/comicode-*.tgz)"

      - name: Verify the global command works from another directory
        working-directory: ${{ runner.temp }}
        run: |
          comicode --version
          comicode --help > /dev/null
        env:
          COMICODE_HOME: ${{ runner.temp }}/comicode-install-home

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
